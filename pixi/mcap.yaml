package:
  name: mcap
  version: 0.0.1

source:
  git: https://github.com/lddnb/mcap_builder.git
  rev: b0374b3e06d59a6d69920d3b61e9e18c1499a6b8

build:
  number: 0
  script: |
    cmake $CMAKE_ARGS \
      -DCMAKE_BUILD_TYPE=Release \
      -DCMAKE_INSTALL_PREFIX=$PREFIX \
      -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
      -DBUILD_SHARED_LIBS=ON \
      -B $SRC_DIR/../build \
      -S .

    cmake --build $SRC_DIR/../build --target install -j2

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - cmake =3.24.3
    - make
    - pkg-config
  host:
    - lz4-c
    - zstd
  run:
    